<style>
  :root {

    --rule: #d8d0c0;
    --sub: #6b6357;

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--rule);

    flex-shrink: 0;
  }

    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.82rem;

    transition: background 0.15s, color 0.15s, border-color 0.15s;

  }

  const map = L.map('map', { zoomControl: true }).setView([HOTEL.lat, HOTEL.lng], 13);

  let markerLayer = L.layerGroup().addTo(map);

  function colorFor(cat) {
    return getComputedStyle(document.documentElement).getPropertyValue('--' + cat).trim() || '#555';

  const starIcon = L.divIcon({
    className: 'star-icon',
    html: '<svg viewBox="0 0 24 24" width="40.5" height="40.5"><path d="M12 2.5l2.9 6.4 7 .6-5.3 4.6 1.6 6.9L12 17.2 5.8 21l1.6-6.9-5.3-4.6 7-.6z" fill="#d4a017" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/></svg>',

  function makeAreaMarker(area) {
    const marker = L.marker([area.lat, area.lng], { icon: starIcon });
    marker.bindTooltip(area.short, { permanent: true, direction: 'right', offset: [21, 0], className: 'map-label' });

  const rainIcon = L.divIcon({

  function makeRainyMarker(item) {
    const marker = L.marker([item.lat, item.lng], { icon: rainIcon });

  const lunchIcon = L.divIcon({
    className: 'lunch-icon',
    html: '<svg viewBox="0 0 24 24" width="34" height="34">' +
      '<circle cx="12" cy="12" r="6" fill="#ffffff" stroke="#2b1a0f" stroke-width="1.2"/>' +
      '<g fill="#2b1a0f">' +

      '<rect x="3" y="2" width="0.8" height="6"/>' +

      '<rect x="1.8" y="7.9" width="3.2" height="0.9"/>' +
      '<rect x="3" y="8.7" width="0.8" height="13.3"/>' +

  function makeLunchMarker(item) {

  function makeMarker(item, isHotel) {
    const color = isHotel ? colorFor('hotel') : colorFor(item.cat);
    const marker = L.circleMarker([item.lat, item.lng], {
      radius: isHotel ? 8 : 9,
      color: '#ffffff',
      weight: 2,
      fillColor: color,
      fillOpacity: 0.95
    });
    marker.bindTooltip(item.short || item.name, {
      permanent: true,
      direction: 'right',
      offset: [8, 0],
      className: 'map-label'
    });
    const html = '<div class="popup-name">' + item.name + '</div>' +
      (item.note ? '<div class="popup-note">' + item.note + '</div>' : '');
    marker.bindPopup(html);
    return marker;
  }

  // Andrew's monotone chain convex hull. Points as [lng, lat] (treated as plain x/y for a small local area).
  function convexHull(points) {
    const pts = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (pts.length < 3) return pts;
    const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
    const lower = [];
    for (const p of pts) {
      while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
      lower.push(p);
    }
    const upper = [];
    for (let i = pts.length - 1; i >= 0; i--) {
      const p = pts[i];
      while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
      upper.push(p);
    }
    upper.pop(); lower.pop();
    return lower.concat(upper);
  }

  function showDay(dayId) {
    markerLayer.clearLayers();
    const day = DAYS.find(d => d.id === dayId);
    if (!day) return;

    const bounds = [];
    const hullPoints = [];

    bounds.push([HOTEL.lat, HOTEL.lng]);
    hullPoints.push([HOTEL.lng, HOTEL.lat]);

    day.items.forEach(item => {
      bounds.push([item.lat, item.lng]);
      hullPoints.push([item.lng, item.lat]);
    });

    // Day-colored polygon first, so markers/labels sit on top of it.
    if (hullPoints.length >= 3) {
      const hull = convexHull(hullPoints);
      if (hull.length >= 3) {
        const latlngs = hull.map(p => [p[1], p[0]]);
        L.polygon(latlngs, {
          color: DAY_COLORS[dayId],
          weight: 1.5,
          fillColor: DAY_COLORS[dayId],
          fillOpacity: 0.12,
          dashArray: '4 4'
        }).addTo(markerLayer);
      }
    }

    markerLayer.addLayer(makeMarker(HOTEL, true));
    day.items.forEach(item => markerLayer.addLayer(makeMarker(item, false)));

    AREAS.filter(a => a.day === dayId).forEach(area => {
      markerLayer.addLayer(makeAreaMarker(area));
      bounds.push([area.lat, area.lng]);
    });

    RAINY.filter(r => r.day === dayId).forEach(item => {
      markerLayer.addLayer(makeRainyMarker(item));
      bounds.push([item.lat, item.lng]);
    });

    LUNCH.filter(l => l.day === dayId).forEach(item => {
      markerLayer.addLayer(makeLunchMarker(item));
      bounds.push([item.lat, item.lng]);
    });

    if (bounds.length > 1) {
      map.fitBounds(bounds, { padding: [50, 50] });
    } else {
      map.setView(bounds[0], 13);
    }

    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', parseInt(t.dataset.day) === dayId);
    });
  }

  const tabsEl = document.getElementById('tabs');
  DAYS.forEach(day => {
    const btn = document.createElement('div');
    btn.className = 'tab';
    btn.textContent = day.label;
    btn.dataset.day = day.id;
    btn.addEventListener('click', () => showDay(day.id));
    tabsEl.appendChild(btn);
  });

  // ---- My location (needs https, e.g. GitHub Pages; does not work from a saved file) ----
  const locLayer = L.layerGroup().addTo(map);
  let locWatch = null, locFirstFix = true;
  const toastEl = document.createElement('div');
  toastEl.className = 'loc-toast';
  document.body.appendChild(toastEl);
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, 5000);
  }

  function stopLocating(btn) {
    if (locWatch !== null) navigator.geolocation.clearWatch(locWatch);
    locWatch = null;
    locLayer.clearLayers();
    btn.classList.remove('active');
  }

  function startLocating(btn) {
    if (!('geolocation' in navigator)) { toast('This browser does not support location.'); return; }
    if (!window.isSecureContext) {
      toast('Location only works when the map is opened from an https link (for example GitHub Pages), not from a saved file.');
      return;
    }
    locFirstFix = true;
    btn.classList.add('active');
    locWatch = navigator.geolocation.watchPosition(pos => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      locLayer.clearLayers();
      L.circle(ll, { radius: pos.coords.accuracy, color: '#2a6fdb', weight: 1, fillColor: '#2a6fdb', fillOpacity: 0.12, interactive: false }).addTo(locLayer);
      L.circleMarker(ll, { radius: 8, color: '#ffffff', weight: 3, fillColor: '#2a6fdb', fillOpacity: 1 })
        .bindPopup('<div class="popup-name">You are here</div>').addTo(locLayer);
      if (locFirstFix) {
        locFirstFix = false;
        map.setView(ll, Math.max(map.getZoom(), 15));
      }
    }, err => {
      stopLocating(btn);
      toast(err.code === 1 ? 'Location permission was denied. Allow it for this site in your browser settings.' : 'Could not get your location.');
    }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  }

  const LocateControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      const box = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
      const a = L.DomUtil.create('a', 'locate-btn', box);
      a.href = '#';
      a.title = 'Show my location';
      a.setAttribute('role', 'button');
      a.setAttribute('aria-label', 'Show my location');
      a.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>';
      L.DomEvent.disableClickPropagation(box);
      L.DomEvent.on(a, 'click', e => {
        L.DomEvent.preventDefault(e);
        if (locWatch === null) startLocating(a); else stopLocating(a);
      });
      return box;
    }
  });
  map.addControl(new LocateControl());
